<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark Mode Gradients (Sawad Neon Lime + Emerald + Coral) -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#141419" />
    </linearGradient>
    <linearGradient id="darkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5ff41" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f46c38" />
    </linearGradient>
    <linearGradient id="darkStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(197, 255, 65, 0.6)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.2)" />
    </linearGradient>

    <!-- Light Mode Gradients (Ayoola Purple + Blue + Coral) -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f2f5" />
    </linearGradient>
    <linearGradient id="lightGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="lightStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(147, 51, 234, 0.4)" />
      <stop offset="100%" stop-color="rgba(37, 99, 235, 0.2)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Default: Dark Theme */
    .favicon-bg { fill: url(#darkBg); stroke: url(#darkStroke); stroke-width: 2; }
    .favicon-symbol { fill: url(#darkGlow); filter: url(#neonBlur); }
    .favicon-core { fill: #ffffff; }

    /* Browser Light Theme Adaptation */
    @media (prefers-color-scheme: light) {
      .favicon-bg { fill: url(#lightBg); stroke: url(#lightStroke); stroke-width: 2; }
      .favicon-symbol { fill: url(#lightGlow); filter: url(#neonBlur); }
      .favicon-core { fill: #0f172a; }
    }
  </style>

  <!-- Squircle Outer Shell -->
  <rect class="favicon-bg" x="3" y="3" width="58" height="58" rx="16" />

  <!-- Cybernetic Energy Bolt / AN Monogram -->
  <path
    class="favicon-symbol"
    d="M34.5 9.5L16.5 33H30L25.5 54.5L47.5 28.5H33L34.5 9.5Z"
    stroke-linejoin="round"
  />

  <!-- High-Precision Core Accent -->
  <path
    class="favicon-core"
    opacity="0.9"
    d="M33 16L22.5 31.5H31L28 45.5L41.5 29.5H32L33 16Z"
  />
</svg>