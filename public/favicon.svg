<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark Mode Palette -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#141418" />
    </linearGradient>
    <linearGradient id="letterDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5ff41" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="strokeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(197, 255, 65, 0.4)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.15)" />
    </linearGradient>

    <!-- Light Mode Palette -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f5f8" />
    </linearGradient>
    <linearGradient id="letterLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="strokeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 0, 0, 0.08)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.04)" />
    </linearGradient>

    <!-- Glow Filter for Dark Mode -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .fav-bg {
      fill: url(#bgDark);
      stroke: url(#strokeDark);
      stroke-width: 1.5;
    }
    .fav-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#letterDark);
      filter: url(#subtleGlow);
    }
    .fav-accent {
      fill: #c5ff41;
    }

    @media (prefers-color-scheme: light) {
      .fav-bg {
        fill: url(#bgLight);
        stroke: url(#strokeLight);
        stroke-width: 1.5;
      }
      .fav-text {
        fill: url(#letterLight);
        filter: none;
      }
      .fav-accent {
        fill: #10b981;
      }
    }
  </style>

  <!-- Squircle Base -->
  <rect class="fav-bg" x="2" y="2" width="60" height="60" rx="16" />

  <!-- Minimalist Monogram "A" -->
  <!-- Geometric "A" with stylized crossbar -->
  <g transform="translate(32, 33)">
    <!-- Main A glyph -->
    <path
      d="M -13 14 L -2 -17 C -0.8 -20.2 0.8 -20.2 2 -17 L 13 14 L 6.5 14 L 3.5 4.5 L -3.5 4.5 L -6.5 14 Z M 0 -7.5 L 2.2 0.5 L -2.2 0.5 Z"
      class="fav-text"
    />
    <!-- Minimalist Signature Dot -->
    <circle cx="15.5" cy="11.5" r="2.5" class="fav-accent" />
  </g>
</svg>